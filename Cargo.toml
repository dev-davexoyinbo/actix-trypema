[package]
name = "actix-trypema"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "actix-web middleware for the trypema sliding-window rate limiter"
license = "MIT"
repository = "https://github.com/dev-davexoyinbo/actix-trypema"
documentation = "https://docs.rs/actix-trypema"
homepage = "https://trypema.davidoyinbo.com/actix-web"
keywords = ["rate-limiting", "actix-web", "middleware", "throttling", "actix"]
categories = ["web-programming::http-server"]
exclude = [".github", "compose.yaml"]

[dependencies]
actix-web = { version = "4.15", default-features = false }
pin-project-lite = "0.2"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
trypema = "2.2"
serde_json = { version = "1", optional = true }
metrics = { version = "0.24", optional = true }

[features]
redis = ["trypema/redis-tokio"]
json = ["dep:serde_json"]
metrics = ["dep:metrics"]

[dev-dependencies]
actix-web = { version = "4.15", features = ["macros"] }
actix-governor = "0.10"
futures-core = "0.3"
redis = { version = "1.7.1", default-features = false }
criterion = { version = "0.8", default-features = false, features = [
  "cargo_bench_support",
] }
proptest = "1"

[package.metadata.docs.rs]
features = ["redis", "json", "metrics"]
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "overhead"
harness = false

[[example]]
name = "redis_login"
required-features = ["redis"]

[[example]]
name = "hybrid_shadow_mode"
required-features = ["redis"]
